<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="kFace" gradientUnits="userSpaceOnUse" x1="30" y1="18" x2="52" y2="82">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6ddff"/>
    </linearGradient>
    <linearGradient id="ringFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ece4ff" stop-opacity="0.45"/>
      <stop offset="46%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d8caff" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="electronFace" cx="34%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f4efff"/>
      <stop offset="100%" stop-color="#c4b1ff"/>
    </radialGradient>
    <filter id="depth" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#2a0f52" flood-opacity="0.5"/>
    </filter>
    <filter id="haloGlow" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <!-- orbit ring, tilted, crisp, behind the mark -->
  <g transform="rotate(-18 50 50)" filter="url(#depth)">
    <ellipse cx="50" cy="50" rx="35.5" ry="14.5" fill="none"
             stroke="url(#ringFace)" stroke-width="3"/>
  </g>

  <!-- electron halo sits under the K's upper arm tip -->
  <circle cx="77.6" cy="32" r="8.5" fill="#d6c9ff" opacity="0.5" filter="url(#haloGlow)"/>

  <!-- the K, crisp with a soft drop-shadow for depth -->
  <g filter="url(#depth)" fill="none" stroke="url(#kFace)"
     stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M31,21 L31,79"/>
    <path d="M31,50 L61,21"/>
    <path d="M31,50 L63,79"/>
  </g>

  <!-- electron core + specular highlight -->
  <circle cx="77.6" cy="32" r="6.7" fill="url(#electronFace)"/>
  <circle cx="75.3" cy="29.7" r="1.9" fill="#ffffff" opacity="0.92"/>
</svg>
