<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="kFace" gradientUnits="userSpaceOnUse" x1="28" y1="24" x2="70" y2="80">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4c4ff"/>
    </linearGradient>
    <linearGradient id="ringFace" gradientUnits="userSpaceOnUse" x1="14" y1="66" x2="86" y2="34">
      <stop offset="0%" stop-color="#efe7ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#cdbcff" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="orbFace" cx="34%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e8ddff"/>
      <stop offset="100%" stop-color="#b49bff"/>
    </radialGradient>
    <filter id="depth" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.3" flood-color="#22093f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- orbit ring: far edge, passes BEHIND the K -->
  <path d="M 85.2 35.8 A 38 16 -22 0 1 14.8 64.2"
        fill="none" stroke="url(#ringFace)" stroke-width="4.4" stroke-linecap="round"/>

  <!-- the K: chunky rounded strokes -->
  <g filter="url(#depth)" fill="none" stroke="url(#kFace)"
     stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34,24 L34,76"/>
    <path d="M34,51 L64,26"/>
    <path d="M34,51 L66,77"/>
  </g>

  <!-- orbit ring: near edge, passes IN FRONT of the K -->
  <path d="M 14.8 64.2 A 38 16 -22 0 1 85.2 35.8"
        fill="none" stroke="url(#ringFace)" stroke-width="4.4" stroke-linecap="round"/>

  <!-- electron sphere at the lower-left end of the orbit -->
  <circle cx="15.5" cy="63.5" r="8.5" fill="#c9b6ff" opacity="0.4" filter="url(#depth)"/>
  <circle cx="15.5" cy="63.5" r="7" fill="url(#orbFace)"/>
  <circle cx="13" cy="61" r="2" fill="#ffffff" opacity="0.9"/>
</svg>
